name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: |
          python -m py_compile pipeline/pipeline_v4.py pipeline/pipeline_v5.py pipeline/pipeline_v6.py pipeline/server.py pipeline/ttfund_client.py pipeline/ttfund_pipeline.py
